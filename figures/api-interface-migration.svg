<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1310" viewBox="0 0 1320 1310" role="img" aria-labelledby="title description">
  <title id="title">Migration des vertragsbasierten API-Aufrufwegs von HTTP zu Electron-IPC</title>
  <desc id="description">Ein gemeinsamer OpenAPI-Vertrag bildet die Ausgangsbasis. Im Web-Prototyp erzeugt Orval Client, React-Query-Hooks und Zod-Schemata. Im Electron-Projekt übernehmen eigene TypeScript-Skripte diese Generierung. Links erfolgt der Aufruf von React per HTTP an einen Express-Route-Handler und PostgreSQL. Rechts ruft der Renderer über eine begrenzte Preload-Bridge den IPC-Dispatcher im Main-Prozess auf. Dieser validiert Anfragen und Ergebnisse und leitet an Handler, Services und Repositories mit SQLite weiter. Gestrichelte Pfeile zeigen Generierung und Einbindung, durchgezogene Pfeile Laufzeitkommunikation. Spätere Online- und Synchronisierungspfade sind nicht dargestellt.</desc>
  <defs>
    <marker id="runtime-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#234d68"/></marker>
    <marker id="build-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68737b"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17242c; font-size: 28px; text-anchor: middle; }
      .heading { font-size: 31px; font-weight: 700; }
      .note { font-size: 25px; fill: #475761; }
      .code { font-family: Consolas, monospace; font-size: 26px; }
      .box { fill: #fff; stroke: #6d7f8b; stroke-width: 2; }
      .runtime { fill: #f3f7fa; stroke: #234d68; stroke-width: 2.5; }
      .flow { fill: none; stroke: #234d68; stroke-width: 3; marker-end: url(#runtime-arrow); }
      .build { fill: none; stroke: #68737b; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#build-arrow); }
    </style>
  </defs>

