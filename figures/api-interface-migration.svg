  <ellipse cx="330" cy="1165" rx="185" ry="20" fill="#edf3f7" stroke="#234d68" stroke-width="2.5"/>
  <text x="330" y="1210" class="heading">PostgreSQL</text>
  <path d="M805 1165 C805 1138 1175 1138 1175 1165 V1211 C1175 1239 805 1239 805 1211 Z" fill="#fff" stroke="#234d68" stroke-width="2.5"/>
  <ellipse cx="990" cy="1165" rx="185" ry="20" fill="#edf3f7" stroke="#234d68" stroke-width="2.5"/>
