<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1510" viewBox="0 0 1400 1510" role="img" aria-labelledby="title description">
  <title id="title">Modulaufteilung der PowerSync- und Supabase-Integration</title>
  <desc id="description">Zwei fachliche IPC-Pfade führen aus dem Renderer durch begrenzte Preload-Funktionen in den Main-Prozess. Die lokale Kernanwendung nutzt API-Dispatcher, Handler, Services und Repositories mit libSQL. Der Kollaborationspfad nutzt einen eigenen IPC-Handler und CollaborationRuntime. Repositories greifen über database.ts und einen Drizzle-Wrapper auf die PowerSync-Datenbank mit better-sqlite3 zu. schema.ts liefert das Client-Schema. Ein Online-Gateway ruft Supabase-RPCs auf; der Connector liefert JWT-Anmeldetoken und lädt Aufgabenänderungen hoch. PowerSync verteilt Backend-Änderungen anhand der Sync Streams. Die Paketierung bindet einen eigenen Worker ein und entpackt native Pakete aus ASAR.</desc>
