<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title description">
  <title id="title">Vergleich zweier Electron-Konfigurationen</title>
  <desc id="description">Links kommuniziert die isolierte Benutzeroberfläche über eine Context Bridge mit dem Preload-Skript und über definierte IPC-Kanäle mit dem Main-Prozess. Der Main-Prozess führt lokale Systemzugriffe aus. Rechts gelangen externe Inhalte ungefiltert in einen Renderer mit aktivierter Node.js-Integration, der direkt auf Systemressourcen zugreifen kann. Der Main-Prozess bleibt auch in dieser Konfiguration vorhanden.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#234d68"/></marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8a4935"/></marker>
    <style>
      text { font-family: Arial, sans-serif; font-size: 24px; fill: #17242c; text-anchor: middle; }
      .heading { font-size: 27px; font-weight: 700; }
      .label { font-weight: 700; }
      .note { font-size: 22px; fill: #475761; }
      .box { fill: #f3f7fa; stroke: #6d7f8b; stroke-width: 2; }
      .open-box { fill: #fcf4f0; stroke: #a67867; stroke-width: 2; }
      .process { fill: #fff; stroke: #6d7f8b; stroke-width: 2; }
      .flow { fill: none; stroke: #234d68; stroke-width: 3; marker-end: url(#arrow); }
      .open-flow { fill: none; stroke: #8a4935; stroke-width: 3; marker-end: url(#open-arrow); }
    </style>
  </defs>
  <text x="270" y="35" class="heading">Isolierte Architektur</text>
  <text x="830" y="35" class="heading">Monolithische Architektur</text>
  <path d="M550 65 V795" stroke="#d5dce0" stroke-width="2"/>

  <rect x="30" y="70" width="480" height="75" rx="8" class="box"/>
  <text x="270" y="101">Externe Inhalte / Links</text>
  <text x="270" y="129" class="note">Restriktive Inhalts- und Navigationsregeln</text>
  <path d="M270 145 V180" class="flow"/>

  <rect x="590" y="70" width="480" height="75" rx="8" class="open-box"/>
  <text x="830" y="101">Externe Inhalte / Links</text>
  <text x="830" y="129" class="note">Ungefilterte Übernahme</text>
  <path d="M830 145 V180" class="open-flow"/>

  <rect x="30" y="185" width="480" height="280" rx="8" class="process"/>
  <text x="270" y="218" class="label">Renderer-Prozess</text>
  <rect x="50" y="237" width="440" height="73" rx="6" class="box"/>
  <text x="270" y="266">Benutzeroberfläche in der Sandbox</text>
  <text x="270" y="295" class="note">nodeIntegration: false · sandbox: true</text>
  <path d="M50 347 H490" stroke="#6d7f8b" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="99" y="330" width="342" height="32" fill="#fff"/>
  <text x="270" y="353" class="note">Context Isolation / contextBridge</text>
  <path d="M270 310 V328 M270 365 V389" class="flow"/>
  <rect x="50" y="395" width="440" height="50" rx="6" class="box"/>
  <text x="270" y="427">Preload: freigegebene Funktionen</text>

  <rect x="590" y="185" width="480" height="280" rx="8" class="open-box"/>
  <text x="830" y="218" class="label">Renderer-Prozess</text>
  <text x="830" y="265">Benutzeroberfläche und externe Inhalte</text>
  <text x="830" y="301" class="note">nodeIntegration: true</text>
  <path d="M830 320 V358" class="open-flow"/>
  <rect x="610" y="365" width="440" height="80" rx="6" class="open-box"/>
  <text x="830" y="399">Node.js-APIs im Renderer</text>
  <text x="830" y="429" class="note">Zugriff auf native Systemfunktionen</text>

  <path d="M270 465 V540" class="flow"/>
  <rect x="85" y="485" width="370" height="32" fill="#fff"/>
  <text x="270" y="509" class="note">IPC: explizit definierte Operationen</text>
  <rect x="30" y="545" width="480" height="90" rx="8" class="box"/>
  <text x="270" y="581" class="label">Main-Prozess</text>
  <text x="270" y="613">Aufrufe prüfen und ausführen</text>
  <path d="M270 635 V715" class="flow"/>
  <rect x="102" y="655" width="336" height="33" fill="#fff"/>
  <text x="270" y="680" class="note">Vermittelter Systemzugriff</text>

  <path d="M830 465 V715" class="open-flow"/>
  <rect x="633" y="548" width="394" height="72" fill="#fff"/>
  <text x="830" y="576">Direkter Systemzugriff</text>
  <text x="830" y="607" class="note">ohne Vermittlung über den Main-Prozess</text>

  <rect x="30" y="720" width="480" height="65" rx="8" class="box"/>
  <text x="270" y="760">Dateisystem / lokale Datenbank</text>
  <rect x="590" y="720" width="480" height="65" rx="8" class="open-box"/>
  <text x="830" y="760">Dateisystem / lokale Datenbank</text>
  <text x="550" y="829" class="note">Der Main-Prozess bleibt in beiden Konfigurationen vorhanden; dargestellt sind die Zugriffspfade.</text>
</svg>
