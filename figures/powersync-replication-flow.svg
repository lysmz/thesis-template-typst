<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810" viewBox="0 0 1100 810" role="img" aria-labelledby="title description">
  <title id="title">Lokale Schreiboperationen und Replikation mit PowerSync</title>
  <desc id="description">Die Benutzeroberfläche liest und schreibt lokal in SQLite. Schreiboperationen werden in der Upload Queue erfasst und bei bestehender Verbindung über REST oder RPC an das Backend übertragen. Nach Validierung schreibt das Backend in die zentrale Datenbank. Deren Änderungen gelangen über logische Replikation zum PowerSync Service und von dort gefiltert zurück in die lokale SQLite-Datenbank der autorisierten Clients.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#234d68"/></marker>
    <marker id="sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#356451"/></marker>
    <style>
      text { font-family: Arial, sans-serif; font-size: 22px; fill: #17242c; text-anchor: middle; }
      .heading { font-size: 27px; font-weight: 700; }
      .label { font-weight: 700; }
      .note { font-size: 20px; fill: #475761; }
      .small { font-size: 18px; fill: #475761; }
      .group { fill: #fff; stroke: #6d7f8b; stroke-width: 2; }
      .box { fill: #f3f7fa; stroke: #6d7f8b; stroke-width: 2; }
      .sync-box { fill: #f0f7f3; stroke: #6d8c7e; stroke-width: 2; }
      .queue { fill: #faf6ed; stroke: #a08c60; stroke-width: 2; }
      .flow { fill: none; stroke: #234d68; stroke-width: 3; marker-end: url(#arrow); }
      .sync-flow { fill: none; stroke: #356451; stroke-width: 3; marker-end: url(#sync-arrow); }
    </style>
  </defs>

  <rect x="25" y="25" width="1050" height="255" rx="10" class="group"/>
  <text x="550" y="67" class="heading">Lokale Persistenzschicht (Client)</text>
  <rect x="50" y="120" width="230" height="105" rx="8" class="box"/>
  <text x="165" y="166" class="label">Benutzeroberfläche</text>
  <text x="165" y="198" class="note">Lokale Bedienung</text>
  <rect x="400" y="120" width="260" height="105" rx="8" class="box"/>
  <text x="530" y="166" class="label">SQLite</text>
  <text x="530" y="198" class="note">Lokale Persistierung</text>
  <rect x="800" y="120" width="250" height="105" rx="8" class="queue"/>
  <text x="925" y="166" class="label">Upload Queue</text>
  <text x="925" y="198" class="note">Ausstehende Änderungen</text>
  <path d="M280 176 H395" class="flow"/>
  <text x="340" y="141" class="small">1. SQL / ORM</text>
  <path d="M660 176 H795" class="flow"/>
  <text x="730" y="141" class="small">2. Erfassen</text>
  <text x="550" y="100" class="note">Lokaler Schreibabschluss ist unabhängig von der Serverbestätigung.</text>

  <path d="M925 225 V445" class="flow"/>
  <rect x="770" y="337" width="310" height="74" fill="#fff"/>
  <text x="925" y="365" class="label">3. Upload: REST / RPC</text>
  <text x="925" y="397" class="note">Bei bestehender Verbindung</text>

  <rect x="650" y="450" width="425" height="295" rx="10" class="group"/>
  <text x="862" y="485" class="heading">Zentrales Backend</text>
  <rect x="675" y="505" width="375" height="65" rx="8" class="box"/>
  <text x="862" y="545">API: Berechtigung und Daten prüfen</text>
  <path d="M862 570 V645" class="flow"/>
  <rect x="702" y="589" width="320" height="32" fill="#fff"/>
  <text x="862" y="613" class="note">4. Änderungen persistieren</text>
  <rect x="675" y="650" width="375" height="70" rx="8" class="box"/>
  <text x="862" y="693" class="label">Zentrale Datenbank (PostgreSQL)</text>

  <rect x="25" y="450" width="465" height="295" rx="10" class="group"/>
  <text x="257" y="485" class="heading">Synchronisationsdienst</text>
  <rect x="50" y="525" width="415" height="195" rx="8" class="sync-box"/>
  <text x="257" y="570" class="label">PowerSync Service</text>
  <text x="257" y="611">Änderungen aus der Datenbank erfassen</text>
  <text x="257" y="649">Sync Rules: Datenpartitionen filtern</text>
  <text x="257" y="687" class="note">Selektive Replikation je Client</text>

  <path d="M675 685 H470" class="sync-flow"/>
  <text x="570" y="619" class="small">5. Logische</text>
  <text x="570" y="645" class="small">Replikation</text>
  <text x="570" y="671" class="small">(WAL)</text>

  <path d="M257 450 V365 H530 V230" class="sync-flow"/>
  <text x="325" y="315" class="label">6. Gefilterter Datenstrom</text>
  <text x="325" y="342" class="note">An autorisierte Clients</text>

  <text x="550" y="790" class="note">Uploads laufen über die Backend-API; Downloads über den PowerSync Service.</text>
</svg>
