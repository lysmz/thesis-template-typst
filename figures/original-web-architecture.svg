  <ellipse cx="840" cy="770" rx="160" ry="21" fill="#edf3f7" stroke="#234d68" stroke-width="2.5"/>
  <text x="840" y="813" class="heading">PostgreSQL</text>
  <text x="840" y="841" class="note">Persistente Anwendungsdaten</text>

  <path class="flow" d="M65 761 H126"/>
  <text x="271" y="768" class="note">Laufzeitkommunikation</text>
  <path class="build" d="M65 802 H126"/>
  <text x="299" y="809" class="note">Codegenerierung / Einbindung</text>
